
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Navbar</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-md navbar-dark bg-dark position-fixed z-3 w-100 top-0">
        <div class="container-fluid">

            <!-- Brand -->
            <a class="navbar-brand" href="#">
                <img width="55px" class="rounded-circle" src="https://i.pinimg.com/736x/59/05/4d/59054db8629f891ee94ae39af49383df.jpg" alt="">
            </a>

            <!-- Toggle Button -->
            <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarMenu"
                aria-controls="navbarMenu"
                aria-expanded="false"
                aria-label="Toggle navigation">

                <span class="navbar-toggler-icon"></span>
            </button>

            <!-- Navbar Content -->
            <div class="collapse navbar-collapse" id="navbarMenu">

                <ul class="navbar-nav me-auto mb-2 mb-md-0">

                    <li class="nav-item">
                        <a class="nav-link active fw-bold text-light" href="#">Home</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link fw-bold text-light" href="#">About</a>
                    </li>

                    <!-- Dropdown -->
                    <li class="nav-item dropdown">
                        <a
                            class="nav-link dropdown-toggle fw-bold text-light"
                            href="#"
                            role="button"
                            data-bs-toggle="dropdown"
                            aria-expanded="false">
                            Shop
                        </a>

                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" href="#">ASUS</a></li>
                            <li><a class="dropdown-item" href="#">MSI</a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-item" href="#">Mac</a></li>
                        </ul>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link text-light fw-bold" href="#" aria-disabled="true">
                            Contact Us
                        </a>
                    </li>

                </ul>

                <!-- Search -->
               <div class="d-flex align-content-center align-items-center">
                 <form class="d-flex" role="search">
                    <input
                        class="form-control me-2"
                        type="search"
                        placeholder="Search"
                        aria-label="Search">

                    <button class="btn btn-outline-success" type="submit">
                        Search
                    </button>
                </form>

                <ul class="list-unstyled text-light d-flex gap-3 mx-3 align-item-center mt-3">
                    <li>
                        <button class="btn btn-secondary text-light fw-bold">Login</button>
                    </li>
                    <li><button class="btn btn-danger">Register</button></li>
                </ul>
                
               </div>

            </div>
        </div>
    </nav>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
